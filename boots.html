<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cek Kelulusan - Bootstrap & JS</title>
    <!-- CSS Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-secondary-subtle">

    <div class="container mt-5">
        <div class="card shadow-lg p-4 mx-auto" style="max-width: 450px;">
            <h3 class="text-center text-primary mb-3">Portal Cek Nilai RPL</h3>

            <div class="mb-3">
                <label for="nilaiInput" class="form-label fw-bold">Masukkan Nilai Ujian (0 - 100):</label>
                <input type="number" class="form-control" id="nilaiInput" placeholder="Contoh: 75">
            </div>

            <button class="btn btn-primary w-100 mb-3" onclick="cekKelulusan()">Cek Status</button>

            <div id="hasilStatus" class="alert d-none text-center fw-bold" role="alert"></div>
        </div>
    </div>

    <!-- Script JavaScript -->
    <script>
        function cekKelulusan() {
            let inputNilai = document.getElementById("nilaiInput").value;
            let kotakPesan = document.getElementById("hasilStatus");

            if (inputNilai === "") {
                alert("Mohon masukkan nilai terlebih dahulu!");
                return;
            }

            let nilai = parseFloat(inputNilai);

            kotakPesan.classList.remove("d-none");

            if (nilai >= 75 && nilai <= 100) {
                kotakPesan.className = "alert alert-success text-center fw-bold";
                kotakPesan.innerHTML = "🎉 Selamat! Nilai " + nilai + " (LULUS Murni). Pertahankan prestasimu!";
            } else if (nilai >= 0 && nilai < 75) {
                kotakPesan.className = "alert alert-danger text-center fw-bold";
                kotakPesan.innerHTML = "⚠️ Nilai " + nilai + " (REMEDIAL). Tetap semangat, yuk belajar lagi!";
            } else {
                kotakPesan.className = "alert alert-warning text-center fw-bold";
                kotakPesan.innerHTML = "❌ Nilai tidak valid! Masukkan angka antara 0 sampai 100.";
            }
        }
    </script>

    <!-- JS Bootstrap Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
